[project]
name = "through-their-eyes"
version = "0.1.0"
description = "See what they saw: perception-first, verified match breakdowns over synthetic football."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Sim and analytics kernels.
    "numpy>=2.1",
    # Schemas that cross process boundaries.
    "pydantic>=2.9",
    # Multi-agent workflow; pinned exactly because it ships weekly (docs/REFERENCES.md).
    "agent-framework-core==1.22.0",
    # Microsoft Foundry chat clients for Agent Framework.
    "agent-framework-foundry==1.15.0",
    # Keyless (Entra ID) auth to Foundry via the az CLI login.
    "azure-identity>=1.19",
    "mcp>=1.24,<2",
    "fastapi>=0.150,<1",
    "uvicorn>=0.54",
    "websockets>=17",
    # Cosmos DB store for cached results and the claims audit (SPEC 8).
    "azure-cosmos>=4.17,<5",
    # Tracing spans for the agent crew, exported to Application Insights (SPEC 8).
    "opentelemetry-api>=1.45,<2",
    "azure-monitor-opentelemetry>=1.8.11,<2",
]

[dependency-groups]
# The downloadable dataset (sim/dataset.py, docs/DATASET.md): its Parquet writer. Apache-2.0;
# a default group so tests and CI have it, kept out of the API image.
dataset = [
    "pyarrow>=21",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# Narration ablation only (eval/narration_ablation.py): Foundry's groundedness evaluator. MIT;
# kept out of the main dependencies so the API image does not carry it (or pandas and nltk).
eval = [
    "azure-ai-evaluation>=1.18.9,<2",
]

[tool.uv]
default-groups = ["dev", "dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Frozen parameter dataclasses are immutable, so they are safe as argument defaults.
extend-immutable-calls = [
    "analytics.vision.VisionParams",
    "sim.ball.BallParams",
    "sim.config.SimParams",
    "sim.decision.DecisionParams",
    "sim.shots.KeeperParams",
    "sim.shots.ShotParams",
]
