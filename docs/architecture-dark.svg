<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Helvetica Neue', Inter, Arial, 'Liberation Sans', sans-serif">
<title id="title">Through Their Eyes architecture</title>
<desc id="desc">The brief's pipeline Ingest, Interpret, Explain, Render, Personalize over sim/, analytics/, explain/, agents/ + api/ and web/. The Microsoft Agent Framework workflow: Director, Analyst (with our MCP tool server), then Telestrator and narration concurrently, narration and the deterministic Verifier in a rewrite loop, and Voice joining both lanes. It runs on Microsoft Foundry, Azure AI Speech, Azure Container Apps, an Azure Storage static website, Azure Cosmos DB, Application Insights and GitHub Actions.</desc>
<defs>
<style>
.bg { fill: #0b1210; }
.panel { fill: #111a17; stroke: #2b3d35; stroke-width: 2; }
.model { fill: #122036; stroke: #7fb2ff; stroke-width: 2.5; }
.code { fill: #272210; stroke: #ffd36b; stroke-width: 2.5; }
.azure { fill: #0e2228; stroke: #a6ecff; stroke-width: 2; }
.dashed { stroke-dasharray: 9 7; }
.wire { fill: none; stroke: #8ea39a; stroke-width: 2.5; }
.head { fill: #8ea39a; }
text { fill: #e6eee9; }
.muted { fill: #9db3a9; }
.c-model { fill: #7fb2ff; }
.c-code { fill: #ffd36b; }
.c-azure { fill: #a6ecff; }
.mono { font-family: 'Cascadia Mono', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; }
.b { font-weight: 700; }
.sb { font-weight: 600; }
.caps { letter-spacing: 2px; }
</style>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
</defs>
<rect width="1920" height="1080" class="bg"/>
<text x="48" y="84" font-size="44" class="b"><tspan x="48" dy="0">Through Their Eyes  ·  architecture</tspan></text>
<text x="48" y="120" font-size="22" class="muted"><tspan x="48" dy="0">Synthetic matches only. Every number on screen is checked by code before it airs.</tspan></text>
<g id="legend">
<rect x="1290" y="58" width="34" height="22" rx="6" class="model"/>
<text x="1336" y="76" font-size="19"><tspan x="1336" dy="0">model step on Microsoft Foundry, template fallback</tspan></text>
<rect x="1290" y="96" width="34" height="22" rx="6" class="code"/>
<text x="1336" y="114" font-size="19"><tspan x="1336" dy="0">deterministic code</tspan></text>
</g>
<g id="pipeline">
<g id="ingest">
<rect x="48" y="146" width="332" height="172" rx="14" class="panel"/>
<text x="68" y="180" font-size="18" class="b caps muted"><tspan x="68" dy="0">1  INGEST</tspan></text>
<text x="68" y="218" font-size="30" class="mono b"><tspan x="68" dy="0">sim/</tspan></text>
<text x="68" y="252" font-size="20" class="muted"><tspan x="68" dy="0">synthetic matches at 25 Hz</tspan><tspan x="68" dy="25">scans, vision and belief</tspan><tspan x="68" dy="25">counterfactual re-simulation</tspan></text>
</g>
<path d="M386,232.0 H415" class="wire" marker-end="url(#head)"/>
<g id="interpret">
<rect x="421" y="146" width="332" height="172" rx="14" class="panel"/>
<text x="441" y="180" font-size="18" class="b caps muted"><tspan x="441" dy="0">2  INTERPRET</tspan></text>
<text x="441" y="218" font-size="30" class="mono b"><tspan x="441" dy="0">analytics/</tspan></text>
<text x="441" y="252" font-size="20" class="muted"><tspan x="441" dy="0">pitch control, pressing, xT</tspan><tspan x="441" dy="25">time to intercept, vision</tspan><tspan x="441" dy="25">scan detector from head yaw</tspan></text>
</g>
<path d="M759,232.0 H788" class="wire" marker-end="url(#head)"/>
<g id="explain">
<rect x="794" y="146" width="332" height="172" rx="14" class="panel"/>
<text x="814" y="180" font-size="18" class="b caps muted"><tspan x="814" dy="0">3  EXPLAIN</tspan></text>
<text x="814" y="218" font-size="30" class="mono b"><tspan x="814" dy="0">explain/</tspan></text>
<text x="814" y="252" font-size="20" class="muted"><tspan x="814" dy="0">moments; lens picked by</tspan><tspan x="814" dy="25">counterfactual impact</tspan><tspan x="814" dy="25">claims + Verifier (code)</tspan></text>
</g>
<path d="M1132,232.0 H1161" class="wire" marker-end="url(#head)"/>
<g id="render">
<rect x="1167" y="146" width="332" height="172" rx="14" class="panel"/>
<text x="1187" y="180" font-size="18" class="b caps muted"><tspan x="1187" dy="0">4  RENDER</tspan></text>
<text x="1187" y="218" font-size="30" class="mono b"><tspan x="1187" dy="0">agents/ + api/</tspan></text>
<text x="1187" y="252" font-size="20" class="muted"><tspan x="1187" dy="0">the agent crew below</tspan><tspan x="1187" dy="25">FastAPI: live WebSocket,</tspan><tspan x="1187" dy="25">breakdowns, what-if, TTS</tspan></text>
</g>
<path d="M1505,232.0 H1534" class="wire" marker-end="url(#head)"/>
<g id="personalize">
<rect x="1540" y="146" width="332" height="172" rx="14" class="panel"/>
<text x="1560" y="180" font-size="18" class="b caps muted"><tspan x="1560" dy="0">5  PERSONALIZE</tspan></text>
<text x="1560" y="218" font-size="30" class="mono b"><tspan x="1560" dy="0">web/</tspan></text>
<text x="1560" y="252" font-size="20" class="muted"><tspan x="1560" dy="0">React + three.js replay:</tspan><tspan x="1560" dy="25">first person and tactical</tspan><tspan x="1560" dy="25">persona × language (en, zh)</tspan></text>
</g>
</g>
<g id="workflow">
<rect x="48" y="342" width="1824" height="474" rx="18" class="panel"/>
<text x="80" y="384" font-size="27" class="b"><tspan x="80" dy="0">agents/  ·  Microsoft Agent Framework workflow</tspan></text>
<text x="80" y="414" font-size="19" class="muted"><tspan x="80" dy="0">one typed message per edge · Telestrator and narration run concurrently · a span per step in Application Insights</tspan></text>
<g id="shared-state">
<rect x="80" y="444" width="432" height="38" rx="19" class="panel"/>
<text x="98" y="469" font-size="19" class="muted"><tspan x="98" dy="0">shared state: MomentCard + verified claims</tspan></text>
</g>
<path d="M195,482 V516" class="wire" marker-end="url(#head)"/>
<g id="director">
<rect x="80" y="518" width="230" height="104" rx="12" class="model"/>
<text x="98" y="554" font-size="26" class="b"><tspan x="98" dy="0">Director</tspan></text>
<text x="296" y="548" font-size="16" class="sb c-model" text-anchor="end"><tspan x="296" dy="0">Foundry</tspan></text>
<text x="98" y="584" font-size="19" class="muted"><tspan x="98" dy="0">builds the request;</tspan><tspan x="98" dy="24">model sets priority</tspan></text>
</g>
<g id="analyst">
<rect x="350" y="518" width="240" height="104" rx="12" class="model"/>
<text x="368" y="554" font-size="26" class="b"><tspan x="368" dy="0">Analyst</tspan></text>
<text x="576" y="548" font-size="16" class="sb c-model" text-anchor="end"><tspan x="576" dy="0">Foundry</tspan></text>
<text x="368" y="584" font-size="19" class="muted"><tspan x="368" dy="0">picks the lens and</tspan><tspan x="368" dy="24">headline claim ids</tspan></text>
</g>
<g id="telestrator">
<rect x="700" y="446" width="340" height="104" rx="12" class="model"/>
<text x="718" y="482" font-size="26" class="b"><tspan x="718" dy="0">Telestrator</tspan></text>
<text x="1026" y="476" font-size="16" class="sb c-model" text-anchor="end"><tspan x="1026" dy="0">Foundry</tspan></text>
<text x="718" y="512" font-size="19" class="muted"><tspan x="718" dy="0">camera, freeze, POV, ghosts;</tspan><tspan x="718" dy="24">validated, else template plan</tspan></text>
</g>
<g id="narration">
<rect x="700" y="590" width="340" height="104" rx="12" class="model"/>
<text x="718" y="626" font-size="26" class="b"><tspan x="718" dy="0">Narration</tspan></text>
<text x="1026" y="620" font-size="16" class="sb c-model" text-anchor="end"><tspan x="1026" dy="0">Foundry</tspan></text>
<text x="718" y="656" font-size="19" class="muted"><tspan x="718" dy="0">Commentator + Co-commentator</tspan><tspan x="718" dy="24">lines anchored to claim ids</tspan></text>
</g>
<g id="verifier">
<rect x="1110" y="590" width="240" height="104" rx="12" class="code"/>
<text x="1128" y="626" font-size="26" class="b"><tspan x="1128" dy="0">Verifier</tspan></text>
<text x="1336" y="620" font-size="16" class="sb c-code" text-anchor="end"><tspan x="1336" dy="0">code</tspan></text>
<text x="1128" y="656" font-size="19" class="muted"><tspan x="1128" dy="0">no model: checks</tspan><tspan x="1128" dy="24">every line</tspan></text>
</g>
<g id="voice">
<rect x="1450" y="518" width="200" height="104" rx="12" class="code"/>
<text x="1468" y="554" font-size="26" class="b"><tspan x="1468" dy="0">Voice</tspan></text>
<text x="1636" y="548" font-size="16" class="sb c-code" text-anchor="end"><tspan x="1636" dy="0">code</tspan></text>
<text x="1468" y="584" font-size="19" class="muted"><tspan x="1468" dy="0">SSML, two voices</tspan><tspan x="1468" dy="24">per language</tspan></text>
</g>
<g id="breakdown">
<rect x="1680" y="518" width="160" height="104" rx="12" class="panel"/>
<text x="1698" y="554" font-size="26" class="b"><tspan x="1698" dy="0">Result</tspan></text>
<text x="1698" y="584" font-size="19" class="muted"><tspan x="1698" dy="0">plan, script,</tspan><tspan x="1698" dy="24">voice cues</tspan></text>
</g>
<path d="M310,570.0 H348" class="wire" marker-end="url(#head)" data-edge="director analyst" data-group="single"/>
<path d="M590,570.0 H640" class="wire"/>
<path d="M640,570.0 V494.0 H698" class="wire" marker-end="url(#head)" data-edge="analyst telestrator" data-group="fan-out"/>
<path d="M640,570.0 V638.0 H698" class="wire" marker-end="url(#head)" data-edge="analyst narration" data-group="fan-out"/>
<text x="640" y="478.0" font-size="19" class="muted" text-anchor="middle"><tspan x="640" dy="0">fan-out</tspan></text>
<path d="M1040,638.0 H1108" class="wire" marker-end="url(#head)" data-edge="narration verifier" data-group="single"/>
<path d="M1170,590 V570.0 H962 V588" class="wire" marker-end="url(#head)" data-edge="verifier narration" data-group="single"/>
<text x="1184" y="579.0" font-size="19" class="muted"><tspan x="1184" dy="0">rewrite ≤ 2, then drop</tspan></text>
<path d="M1040,494.0 H1400 V570.0 H1448" class="wire" marker-end="url(#head)" data-edge="telestrator voice" data-group="fan-in"/>
<path d="M1350,638.0 H1400 V570.0" class="wire" data-edge="verifier voice" data-group="fan-in"/>
<text x="1400" y="478.0" font-size="19" class="muted" text-anchor="middle"><tspan x="1400" dy="0">fan-in</tspan></text>
<path d="M1650,570.0 H1678" class="wire" marker-end="url(#head)"/>
<g id="mcp">
<path d="M455,622 V662" class="wire" marker-end="url(#head)"/>
<path d="M495,664 V624" class="wire" marker-end="url(#head)"/>
<rect x="330" y="664" width="290" height="140" rx="12" class="code"/>
<text x="348" y="694" font-size="22" class="b"><tspan x="348" dy="0">MCP tool server</tspan></text>
<text x="348" y="722" font-size="19" class="muted"><tspan x="348" dy="0">9 tools: moment, claims,</tspan><tspan x="348" dy="24">vision, pitch control, xT,</tspan><tspan x="348" dy="24">pressing, re-sim, what-if</tspan></text>
<text x="348" y="792" font-size="18" class="mono c-code"><tspan x="348" dy="0">TTE_ANALYST_MCP</tspan></text>
</g>
<g id="verifier-detail">
<rect x="700" y="718" width="1140" height="88" rx="12" class="code"/>
<text x="720" y="746" font-size="20" class="b c-code"><tspan x="720" dy="0">Deterministic Verifier  ·  explain/verifier.py, explain/render.py</tspan></text>
<text x="720" y="772" font-size="19" class="muted"><tspan x="720" dy="0">Claims are predicates checked against the simulated match; every verdict is written to the claims audit.</tspan><tspan x="720" dy="24">A line airs only with supported claims, numbers from verified slots and no banned judgement words.</tspan></text>
</g>
</g>
<g id="azure">
<g id="foundry">
<rect x="48" y="840" width="238" height="200" rx="12" class="azure"/>
<text x="66" y="876" font-size="21" class="b"><tspan x="66" dy="0">Microsoft Foundry</tspan></text>
<text x="66" y="904" font-size="18" class="mono c-azure"><tspan x="66" dy="0">gpt-4.1-mini</tspan></text>
<text x="66" y="940" font-size="19" class="muted"><tspan x="66" dy="0">structured outputs for</tspan><tspan x="66" dy="24">every model step and</tspan><tspan x="66" dy="24">what-if questions</tspan></text>
</g>
<g id="speech">
<rect x="302" y="840" width="244" height="200" rx="12" class="azure"/>
<text x="320" y="876" font-size="21" class="b"><tspan x="320" dy="0">Azure AI Speech</tspan></text>
<text x="320" y="904" font-size="18" class="mono c-azure"><tspan x="320" dy="0">neural TTS</tspan></text>
<text x="320" y="940" font-size="19" class="muted"><tspan x="320" dy="0">speaks the SSML from</tspan><tspan x="320" dy="24">the Voice step through</tspan><tspan x="320" dy="24">/api/tts; audio cached</tspan><tspan x="320" dy="24">by content hash</tspan></text>
</g>
<g id="container-apps">
<rect x="562" y="840" width="266" height="200" rx="12" class="azure"/>
<text x="580" y="876" font-size="21" class="b"><tspan x="580" dy="0">Azure Container Apps</tspan></text>
<text x="580" y="904" font-size="18" class="mono c-azure"><tspan x="580" dy="0">tte-api</tspan></text>
<text x="580" y="940" font-size="19" class="muted"><tspan x="580" dy="0">runs api/ and the crew;</tspan><tspan x="580" dy="24">keyless managed identity</tspan><tspan x="580" dy="24">for Foundry, Cosmos DB</tspan><tspan x="580" dy="24">and Container Registry</tspan></text>
</g>
<g id="static-website">
<rect x="844" y="840" width="232" height="200" rx="12" class="azure"/>
<text x="862" y="876" font-size="21" class="b"><tspan x="862" dy="0">Azure Storage</tspan></text>
<text x="862" y="904" font-size="18" class="mono c-azure"><tspan x="862" dy="0">static website</tspan></text>
<text x="862" y="940" font-size="19" class="muted"><tspan x="862" dy="0">hosts web/, the static</tspan><tspan x="862" dy="24">React build, uploaded</tspan><tspan x="862" dy="24">with Entra ID, no keys</tspan></text>
</g>
<g id="cosmos">
<rect x="1092" y="840" width="230" height="200" rx="12" class="azure"/>
<text x="1110" y="876" font-size="21" class="b"><tspan x="1110" dy="0">Azure Cosmos DB</tspan></text>
<text x="1110" y="904" font-size="18" class="mono c-azure"><tspan x="1110" dy="0">serverless</tspan></text>
<text x="1110" y="940" font-size="19" class="muted"><tspan x="1110" dy="0">cache: breakdowns,</tspan><tspan x="1110" dy="24">what-if answers</tspan><tspan x="1110" dy="24">claims_audit: every</tspan><tspan x="1110" dy="24">claim verdict</tspan></text>
</g>
<g id="app-insights">
<rect x="1338" y="840" width="252" height="200" rx="12" class="azure"/>
<text x="1356" y="876" font-size="21" class="b"><tspan x="1356" dy="0">Application Insights</tspan></text>
<text x="1356" y="904" font-size="18" class="mono c-azure"><tspan x="1356" dy="0">OpenTelemetry</tspan></text>
<text x="1356" y="940" font-size="19" class="muted"><tspan x="1356" dy="0">one trace per</tspan><tspan x="1356" dy="24">breakdown, a span per</tspan><tspan x="1356" dy="24">step with its source</tspan><tspan x="1356" dy="24">(model or template)</tspan></text>
</g>
<g id="github-actions">
<rect x="1606" y="840" width="266" height="200" rx="12" class="azure"/>
<text x="1624" y="876" font-size="21" class="b"><tspan x="1624" dy="0">GitHub Actions</tspan></text>
<text x="1624" y="904" font-size="18" class="mono c-azure"><tspan x="1624" dy="0">OIDC deploy</tspan></text>
<text x="1624" y="940" font-size="19" class="muted"><tspan x="1624" dy="0">CI on PRs and on main;</tspan><tspan x="1624" dy="24">a green main rolls out</tspan><tspan x="1624" dy="24">the API and the web app</tspan><tspan x="1624" dy="24">with no stored secret</tspan></text>
</g>
</g>
</svg>
