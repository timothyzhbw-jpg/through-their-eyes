name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A change that touches nothing but prose skips the three heavy jobs (a loaded runner takes
  # 35-45 minutes on them). Prose here means the docs no test or script reads: SPEC, REFERENCES
  # and DATASET are read by tests, README by the video test that takes the web app's URL from it,
  # so those still run everything. Any doubt (no base to compare with, a failed diff) runs it all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1  # the checkout is the merge of the PR into its base
          else
            base="$BEFORE"
          fi
          if files=$(git diff --name-only "$base" HEAD 2>/dev/null) && [ -n "$files" ]; then
            prose='^(CLAUDE\.md|docs/(drafts|screenshots)/.*|docs/(?!(SPEC|REFERENCES|DATASET)\.md$)[A-Z_]+\.md)$'
            if ! echo "$files" | grep -qvP "$prose"; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"
          echo "$files" | head -50

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Shell syntax
        run: bash -n infra/*.sh
      - name: Tests
        run: uv run pytest -q

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Licences
        run: npm run licenses
      - name: Typecheck
        run: npm run typecheck
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Video shot list
        run: node ../video/capture.mjs --list
      - name: Video trailer spec and edit tests
        run: node ../video/trailer.mjs --check && node --test ../video/test/*.test.mjs

  # SPEC 7, 8: the web app built against a local offline API and opened page by page in headless
  # Chromium (web/scripts/smoke.mjs). Any console error, uncaught exception or missing main view
  # fails it; the screenshots are kept as an artifact.
  smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25  # the smoke suite passed 10 minutes on a loaded runner (29 pages, axe on each)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          uv sync --locked
          npm ci --prefix web
      - name: Chromium version
        id: chromium
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          echo "playwright=$(node -p 'require("./web/node_modules/playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-core-${{ steps.chromium.outputs.playwright }}
      - name: Install Chromium
        working-directory: web
        run: npx playwright-core install --no-shell chromium
      - name: Smoke test
        working-directory: web
        run: npm run smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-smoke
          path: out/smoke/
          if-no-files-found: ignore
          retention-days: 14
