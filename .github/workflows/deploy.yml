name: deploy

# SPEC 8: after CI passes on main, roll out the API image to Azure Container Apps and the web app
# to the Azure Storage static website. Azure login is OIDC through a user-assigned managed identity
# whose federated credential trusts only this repo's main branch; no Azure secret is stored here.
# The identity, registry and app names, and the API URL the web build points at (TTE_API_URL), are
# repo variables set by `infra/deploy.sh github`.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ${{ vars.TTE_ACR }}.azurecr.io/tte-api
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # ACR Tasks is not allowed on Azure for Students: build on the runner (linux/amd64).
      - name: Build and push
        run: |
          az acr login -n "${{ vars.TTE_ACR }}"
          docker build -t "$IMAGE:${SHA::7}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${SHA::7}"
          docker push "$IMAGE:latest"
      - name: Roll out
        run: |
          az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.TTE_ACA_APP }}" \
            --image "$IMAGE:${SHA::7}" -o none
          fqdn=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ vars.TTE_ACA_APP }}" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fsS "https://$fqdn/health" | grep -q '"status":"ok"'; then
              echo "healthy: https://$fqdn"; exit 0
            fi
            sleep 10
          done
          echo "the new revision did not become healthy" >&2; exit 1

  web:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        env:
          # The API the web app talks to (SPEC 2). Unset: the build plays the bundled data only.
          VITE_API_URL: ${{ vars.TTE_API_URL }}
        run: |
          npm ci
          npm run build
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Upload to the static website
        run: |
          az storage blob upload-batch --account-name "${{ vars.TTE_SITE_ACCOUNT }}" \
            --auth-mode login -d '$web' -s web/dist --overwrite \
            --content-cache-control "public, max-age=300" -o none
