name: deploy

# SPEC 8: after CI passes on main, roll out the API image to Azure Container Apps and the web app
# to the Azure Storage static website. Only a CI run whose python, web and smoke jobs all ran and
# passed deploys (job `gate`): a push that changed nothing but prose skips those jobs (ci.yml), and
# that run is green without having tested the tree, so it deploys nothing. Azure login is OIDC through a user-assigned managed identity
# whose federated credential trusts only this repo's main branch; no Azure secret is stored here.
# The identity, registry and app names, and the API URL the web build points at (TTE_API_URL), are
# repo variables set by `infra/deploy.sh github`.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read  # the gate reads the CI run's jobs

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # A manual dispatch deploys what it is given. After a CI run, deploy only when python, web and
  # smoke each ran and succeeded (a skipped job is not a pass).
  gate:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          deploy=false
          if [ "$EVENT" = workflow_dispatch ]; then
            deploy=true
          elif [ "$CONCLUSION" = success ]; then
            ran=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --paginate \
              --jq '[.jobs[] | select(.name == "python" or .name == "web" or .name == "smoke")
                     | select(.conclusion == "success")] | length')
            echo "heavy jobs that succeeded: $ran of 3"
            [ "$ran" = 3 ] && deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "deploy: $deploy"

  api:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ${{ vars.TTE_ACR }}.azurecr.io/tte-api
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # ACR Tasks is not allowed on Azure for Students: build on the runner (linux/amd64).
      - name: Build and push
        run: |
          az acr login -n "${{ vars.TTE_ACR }}"
          docker build -t "$IMAGE:${SHA::7}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${SHA::7}"
          docker push "$IMAGE:latest"
      - name: Roll out
        run: |
          az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.TTE_ACA_APP }}" \
            --image "$IMAGE:${SHA::7}" -o none
          fqdn=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ vars.TTE_ACA_APP }}" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fsS "https://$fqdn/health" | grep -q '"status":"ok"'; then
              echo "healthy: https://$fqdn"; exit 0
            fi
            sleep 10
          done
          echo "the new revision did not become healthy" >&2; exit 1

  web:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        env:
          # The API the web app talks to (SPEC 2). Unset: the build plays the bundled data only.
          VITE_API_URL: ${{ vars.TTE_API_URL }}
        run: |
          npm ci
          npm run build
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Upload to the static website
        # Gzipped, every file read back from the site with its type and bytes before index.html
        # goes up, then the page loaded in Chrome; the previous index.html comes back on failure
        # (infra/upload_web.sh).
        run: |
          site=$(az storage account show -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ vars.TTE_SITE_ACCOUNT }}" --query primaryEndpoints.web -o tsv)
          infra/upload_web.sh "${{ vars.TTE_SITE_ACCOUNT }}" "$site"
