<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080e0b" />
    <meta
      name="description"
      content="See what they saw: a synthetic football moment replayed through the player's eyes."
    />
    <!-- The card a shared link unfurls into (Teams, Slack, Devpost, mail): a still of the app, our
         own synthetic render (public/og.jpg, 1200 x 630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Through Their Eyes" />
    <meta property="og:title" content="Through Their Eyes: see what they saw" />
    <meta
      property="og:description"
      content="A synthetic football match explained through the player's own perception: the look before the ball arrived, what he believed, and the moment re-simulated without it."
    />
    <meta property="og:url" content="https://ttesite1ff906.z14.web.core.windows.net/" />
    <meta property="og:image" content="https://ttesite1ff906.z14.web.core.windows.net/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A night match seen through a midfielder's eyes as he looks over his shoulder; fictional players."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Through Their Eyes</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The players' model and kit design, fetched after the scripts instead of after the first
         frame (SPEC 7). three.js requests both with crossorigin="anonymous". -->
    <link
      rel="preload"
      href="/models/grf_player_look.glb"
      as="fetch"
      crossorigin
      fetchpriority="low"
    />
    <link rel="preload" href="/models/kit_mask.webp" as="image" crossorigin fetchpriority="low" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Geist:wght@100..900&family=Geist+Mono:wght@400..600&family=IBM+Plex+Mono:wght@600;700&family=Saira+Condensed:wght@600;700&display=swap"
    />
  </head>
  <body>
    <!-- Shown as soon as the page arrives; main.tsx replaces it. -->
    <div id="root"><p class="loading">Loading the match…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
