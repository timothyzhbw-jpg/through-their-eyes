<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080e0b" />
    <meta
      name="description"
      content="See what they saw: a synthetic football moment replayed through the player's eyes."
    />
    <title>Through Their Eyes</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The players' model, fetched after the scripts instead of after the first frame (SPEC 7). -->
    <link rel="preload" href="/models/grf_player.glb" as="fetch" crossorigin fetchpriority="low" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Geist:wght@100..900&family=Geist+Mono:wght@400..600&family=IBM+Plex+Mono:wght@600;700&family=Saira+Condensed:wght@600;700&display=swap"
    />
  </head>
  <body>
    <!-- Shown as soon as the page arrives; main.tsx replaces it. -->
    <div id="root"><p class="loading">Loading the match…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
